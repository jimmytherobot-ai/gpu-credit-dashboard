// ── Cumulative sums (start at 0 on Jan 1) ────────────────────────
let cMints = 0, cBurns = 0;
const cumMints = [];
const cumBurns = [];

const netYTD = [];

raw.forEach(r => {
  cMints += r[1];
  cBurns += r[2];
  cumMints.push(+cMints.toFixed(4));
  cumBurns.push(-(+cBurns.toFixed(4)));    // negative → fills below zero
  netYTD.push(+(cMints - cBurns).toFixed(4));
});
