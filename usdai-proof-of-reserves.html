// ── 7-day calendar-window rolling average ──
// For each row, average all observations whose date falls within
// the preceding 7 calendar days (inclusive). Applied per series independently.
const MS_7D = 7 * 24 * 60 * 60 * 1000;

const parsed = rawRows.map(r => ({
  t: new Date(r[0]).getTime(),
  wm: r[1], pyusd: r[2], loan: r[3]
}));

const rows = parsed.map((row, i) => {
  const window = parsed.filter(r => r.t >= row.t - MS_7D && r.t <= row.t);
  const n = window.length;
  return {
    t: row.t,
    wm:    window.reduce((s, r) => s + r.wm,    0) / n,
    pyusd: window.reduce((s, r) => s + r.pyusd,  0) / n,
    loan:  window.reduce((s, r) => s + r.loan,   0) / n,
  };
});

// Series definitions (bottom → top in the stack)
const series = [
  { key: 'wm',    label: 'Wrapped M (wM)',  color: '#2AB5A6' },
  { key: 'pyusd', label: 'PYUSD',           color: '#C4913A' },
  { key: 'loan',  label: 'GPU Loan Book',   color: '#8C6B4A' },
];

// Build Chart.js point arrays: { x: Date, y: smoothed value }
const datasets = series.map(s => ({
  label: s.label,
  data: rows.map(r => ({ x: new Date(r.t), y: r[s.key] })),
  backgroundColor: s.color + '30',
  borderColor: s.color,
  borderWidth: 2,
  fill: 'stack',
  pointRadius: 0,
  pointHitRadius: 6,
  tension: 0.3,
}));

Chart.defaults.font.family = "'Geist', 'Helvetica Neue', Helvetica, Arial, sans-serif";

const ctx = document.getElementById('chart').getContext('2d');
new Chart(ctx, {
  type: 'line',
  data: { datasets },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    scales: {
      x: {
        type: 'time',
        time: {
          unit: 'month',
          displayFormats: { month: 'MMM yyyy' },
        },
        min: new Date('2025-08-18'),
        max: new Date('2026-05-31'),
        grid: {
          display: false,
        },
        border: {
          display: true,
          color: 'rgba(0,0,0,0.1)',
        },
        ticks: {
          color: '#8A7F74',
          font: { size: 11 },
          maxRotation: 0,
          autoSkip: false,
        },
      },
      y: {
        stacked: true,
        min: 0,
        max: 700,
        grid: {
          color: 'rgba(0,0,0,0.06)',
          drawBorder: false,
        },
        border: {
          display: false,
          dash: [4, 4],
        },
        ticks: {
          color: '#8A7F74',
          font: { size: 11 },
          stepSize: 100,
          callback: v => '$' + v + 'M',
        },
        title: {
          display: false,
        },
      },
    },
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: '#FFFFFF',
        titleColor: '#2C2622',
        bodyColor: '#6F5F4E',
        borderColor: 'rgba(0,0,0,0.1)',
        borderWidth: 1,
        titleFont: { size: 12, weight: '600' },
        bodyFont: { size: 12 },
        padding: 12,
        cornerRadius: 8,
        callbacks: {
          title: ctx => {
            const d = new Date(ctx[0].parsed.x);
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          },
          label: ctx => {
            const v = ctx.raw.y;
            return `  ${ctx.dataset.label}: $${v.toFixed(1)}M`;
          },
          afterBody: ctx => {
            const total = ctx.reduce((s, c) => s + c.raw.y, 0);
            return `\n  Total: $${total.toFixed(1)}M`;
          }
        }
      },
    },
    layout: {
      padding: { top: 8, right: 8, bottom: 0, left: 0 },
    },
  },
});

    <span>${s.label}</span>
  `;
  legendEl.appendChild(item);
});
