        pointRadius: 2.5,
        pointHoverRadius: 5,
        pointBackgroundColor: ctx => (ctx.parsed?.y ?? 0) >= 0 ? '#2AB5A6' : '#C4613A',
        pointBorderColor: 'transparent',
        fill: {
          target: 'origin',
          above: 'rgba(42,181,166,0.08)',
          below: 'rgba(196,97,58,0.08)',
        },
        tension: 0.25,
        segment: {
          borderColor: ctx => {
            const y0 = ctx.p0.parsed.y, y1 = ctx.p1.parsed.y;
            if (y0 >= 0 && y1 >= 0) return '#2AB5A6';
            if (y0 < 0  && y1 < 0)  return '#C4613A';
            return y0 >= 0 ? '#2AB5A6' : '#C4613A';
          },
        },
        yAxisID: 'yDev',
        order: 1,
      },
    ],
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    scales: {
      x: {
        type: 'time',
        time: {
          unit: 'month',
          displayFormats: { month: 'MMM yyyy' },
        },
        min: new Date('2026-01-01'),
        max: new Date('2026-05-14'),
        offset: false,
        grid: { color: 'rgba(0,0,0,0.05)', drawTicks: false },
        border: { display: true, color: 'rgba(0,0,0,0.12)' },
        ticks: {
          color: '#8A7F74', font: { size: 11 },
          maxRotation: 0, autoSkip: false, padding: 8,
        },
      },
      // ── Left axis: peg deviation ─────────────────────────────
      yDev: {
        position: 'left',
        min: -0.40,
        max:  0.20,
        grid: {
          color: ctx => ctx.tick.value === 0
            ? 'rgba(0,0,0,0.35)'
            : 'rgba(0,0,0,0.05)',
          lineWidth: ctx => ctx.tick.value === 0 ? 2 : 1,
          drawBorder: false,
        },
        border: { display: false },
        ticks: {
          color: '#8A7F74', font: { size: 11 }, padding: 8,
          stepSize: 0.05,
          callback: v => (v >= 0 ? '+' : '') + v.toFixed(2) + '%',
        },
        title: {
          display: true,
          text: '% Deviation from Peg',
          color: '#8A7F74',
          font: { size: 11 },
          padding: { right: 10 },
        },
      },
      // ── Right axis: volume ───────────────────────────────────
      yVol: {
        position: 'right',
        min: 0,
        grid: { display: false },
        border: { display: false },
        ticks: {
          color: '#B8AA98', font: { size: 11 }, padding: 8,
          callback: v => {
            if (v >= 1e6) return '$' + (v / 1e6).toFixed(0) + 'M';
            if (v >= 1e3) return '$' + (v / 1e3).toFixed(0) + 'K';
            return '$' + v;
          },
        },
        title: {
          display: true,
          text: 'Volume (USD)',
          color: '#B8AA98',
          font: { size: 11 },
          padding: { left: 10 },
        },
      },
    },
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: '#FFFFFF',
        titleColor: '#2C2622', bodyColor: '#6F5F4E',
        borderColor: 'rgba(0,0,0,0.1)', borderWidth: 1,
        titleFont: { size: 12, weight: '600' },
        bodyFont: { size: 12 }, padding: 12, cornerRadius: 8,
        callbacks: {
          title: ctx => {
            const d = new Date(ctx[0].parsed.x);
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          },
          label: ctx => {
            if (ctx.dataset.label === 'Volume (USD)') {
              const v = ctx.parsed.y;
              const fmt = v >= 1e6
                ? '$' + (v / 1e6).toFixed(2) + 'M'
                : '$' + (v / 1e3).toFixed(0) + 'K';
              return `  Volume: ${fmt}`;
            }
            const v = ctx.parsed.y;
            const tag  = v >= 0 ? '▲ Premium' : '▼ Discount';
            const sign = v >= 0 ? '+' : '';
            return `  ${tag}: ${sign}${v.toFixed(4)}%`;
          },
          afterLabel: ctx => {
            if (ctx.dataset.label !== 'Volume (USD)') {
              const v = ctx.parsed.y;
              return `  VWAP: $${(1 + v / 100).toFixed(6)}`;
            }
          }
        }
      },
    },
    layout: { padding: { top: 12, right: 8, bottom: 0, left: 0 } },
  },
});
</script>
</body>
</html>
