<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sCHIP Staked Over Time</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .chart-container { width: 900px; padding: 32px; background: #0f0f1a; border-radius: 16px; border: 1px solid #1e1e3a; }
  .chart-header { margin-bottom: 24px; }
  .chart-title { font-size: 18px; font-weight: 600; color: #e2e8f0; }
  .chart-subtitle { font-size: 13px; color: #64748b; margin-top: 4px; }
  .chart-wrap { position: relative; height: 340px; }
  .stat-row { display: flex; gap: 24px; margin-top: 20px; }
  .stat { background: #14142a; border-radius: 8px; padding: 12px 16px; flex: 1; border: 1px solid #1e1e3a; }
  .stat-label { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; }
  .stat-value { font-size: 20px; font-weight: 700; color: #e2e8f0; margin-top: 4px; }
  .stat-value.green { color: #10b981; }
</style>
</head>
<body>
<div class="chart-container">
  <div class="chart-header">
    <div class="chart-title">sCHIP Staked Over Time</div>
    <div class="chart-subtitle">Cumulative CHIP staked as sCHIP since listing · Arbitrum · TGE Apr 21, 2026</div>
  </div>
  <div class="chart-wrap">
    <canvas id="chart"></canvas>
  </div>
  <div class="stat-row">
    <div class="stat">
      <div class="stat-label">Current Staked</div>
      <div class="stat-value">21.9M sCHIP</div>
    </div>
    <div class="stat">
      <div class="stat-label">Peak Staked</div>
      <div class="stat-value">22.0M sCHIP</div>
    </div>
    <div class="stat">
      <div class="stat-label">Growth (Apr 21 → now)</div>
      <div class="stat-value green">+3,570%</div>
    </div>
    <div class="stat">
      <div class="stat-label">% of 300M Supply</div>
      <div class="stat-value">7.3%</div>
    </div>
  </div>
</div>
<script>
const DATA = [
  {date:"Apr 21",v:595917},
  {date:"Apr 22",v:909087},
  {date:"Apr 23",v:12602515},
  {date:"Apr 24",v:13843518},
  {date:"Apr 25",v:17668356},
  {date:"Apr 26",v:17917460},
  {date:"Apr 27",v:18108581},
  {date:"Apr 28",v:17832339},
  {date:"Apr 29",v:16576188},
  {date:"Apr 30",v:16642918},
  {date:"May 1",v:16663946},
  {date:"May 2",v:16688584},
  {date:"May 3",v:16693708},
  {date:"May 4",v:16699682},
  {date:"May 5",v:16196364},
  {date:"May 6",v:16247620},
  {date:"May 7",v:16310954},
  {date:"May 8",v:17018570},
  {date:"May 9",v:17635635},
  {date:"May 10",v:17523903},
  {date:"May 11",v:17525310},
  {date:"May 12",v:17545569},
  {date:"May 13",v:17547482},
  {date:"May 14",v:17575661},
  {date:"May 15",v:17585607},
  {date:"May 16",v:17487549},
  {date:"May 17",v:17487237},
  {date:"May 18",v:18564407},
  {date:"May 19",v:17736179},
  {date:"May 20",v:17717094},
  {date:"May 21",v:17829307},
  {date:"May 23",v:17786275},
  {date:"May 24",v:17792752},
  {date:"May 25",v:17793776},
  {date:"May 26",v:17795711},
  {date:"May 27",v:21999209},
  {date:"May 28",v:21868597},
];

const ctx = document.getElementById('chart').getContext('2d');
new Chart(ctx, {
  type: 'line',
  data: {
    labels: DATA.map(d => d.date),
    datasets: [{
      label: 'sCHIP Staked',
      data: DATA.map(d => d.v / 1e6),
      borderColor: '#f59e0b',
      backgroundColor: 'rgba(245,158,11,0.08)',
      borderWidth: 2.5,
      pointRadius: 3,
      pointBackgroundColor: '#f59e0b',
      pointHoverRadius: 5,
      fill: true,
      tension: 0.3,
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: '#1e1e3a',
        titleColor: '#94a3b8',
        bodyColor: '#e2e8f0',
        borderColor: '#2d2d5a',
        borderWidth: 1,
        callbacks: {
          label: ctx => `${ctx.parsed.y.toFixed(2)}M sCHIP`
        }
      }
    },
    scales: {
      x: {
        grid: { color: 'rgba(255,255,255,0.04)' },
        ticks: { color: '#64748b', font: { size: 11 }, maxTicksLimit: 12 }
      },
      y: {
        grid: { color: 'rgba(255,255,255,0.04)' },
        ticks: {
          color: '#64748b',
          font: { size: 11 },
          callback: v => v.toFixed(0) + 'M'
        },
        min: 0,
      }
    }
  }
});
</script>
</body>
</html>
