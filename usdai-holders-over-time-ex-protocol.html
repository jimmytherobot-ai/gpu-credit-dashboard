        stacked: true,
        min: 0,
        grid: { color: 'rgba(0,0,0,0.06)', drawBorder: false },
        border: { display: false },
        ticks: {
          color: '#8A7F74', font: { size: 11 }, padding: 8,
          callback: v => v >= 1000 ? (v/1000).toFixed(1) + 'B' : v.toFixed(0) + 'M',
        },
      },
    },
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: '#FFFFFF',
        titleColor: '#2C2622', bodyColor: '#6F5F4E',
        borderColor: 'rgba(0,0,0,0.1)', borderWidth: 1,
        titleFont: { size: 12, weight: '600' },
        bodyFont: { size: 12 }, padding: 12, cornerRadius: 8,
        callbacks: {
          title: ctx => {
            const d = new Date(ctx[0].parsed.x);
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          },
          label: ctx => {
            const v = ctx.raw.y;
            const fmt = v >= 1000 ? (v/1000).toFixed(2)+'B' : v.toFixed(2)+'M';
            return `  ${ctx.dataset.label}: ${fmt}`;
          },
          afterBody: ctx => {
            const total = ctx.reduce((s, c) => s + c.raw.y, 0);
            const fmt = total >= 1000 ? (total/1000).toFixed(2)+'B' : total.toFixed(2)+'M';
            return `\n  Total: ${fmt}`;
          }
        }
      },
    },
    layout: { padding: { top: 8, right: 8, bottom: 0, left: 0 } },
  },
});

// ── Legend ────────────────────────────────────────────────────────
const legendEl = document.getElementById('legend');
[...SERIES].reverse().forEach(s => {
  const item = document.createElement('div');
  item.className = 'legend-item';
  item.innerHTML = `<span class="legend-swatch" style="background:${s.color}90;border:1px solid ${s.color}"></span><span>${s.display}</span>`;
  legendEl.appendChild(item);
});
</script>
</body>
</html>
