const volPoints = raw.map(r => ({ x: new Date(r[0]), y: r[2] }));

Chart.defaults.font.family = "'Geist', 'Helvetica Neue', Helvetica, Arial, sans-serif";

const ctx = document.getElementById('chart').getContext('2d');
new Chart(ctx, {
  type: 'bar',
  data: {
    datasets: [
      // Volume bars — render behind (order: 2)
      {
        type: 'bar',
        label: 'Volume (USD)',
        data: volPoints,
        backgroundColor: 'rgba(138,127,116,0.28)',
        borderColor:     'rgba(138,127,116,0.48)',
        borderWidth: 1,
        borderRadius: 2,
        yAxisID: 'yVol',
        order: 2,
      },
      // Deviation line — render in front (order: 1)
      {
        type: 'line',
        label: 'sUSDai % Deviation',
        data: devPoints,
        borderColor: '#22C55E',
        borderWidth: 2,
        pointRadius: 0,
        pointHoverRadius: 5,
        pointHoverBackgroundColor: '#22C55E',
        fill: false,
        tension: 0.2,
        yAxisID: 'yDev',
        order: 1,
      },
    ],
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    scales: {
      x: {
        type: 'time',
        time: { unit: 'month', displayFormats: { month: 'MMM yyyy' } },
        min: new Date('2026-01-01'),
        max: new Date('2026-05-13'),
        offset: false,
        grid: { color: 'rgba(0,0,0,0.05)', drawTicks: false },
        border: { display: true, color: 'rgba(0,0,0,0.12)' },
        ticks: {
          color: '#8A7F74', font: { size: 11 },
          maxRotation: 0, autoSkip: false, padding: 8,
        },
      },
      // Left: peg deviation, tightly zoomed
      yDev: {
        position: 'left',
        min: -1.0,
        max:  1.0,
        grid: { color: 'rgba(0,0,0,0.05)', drawBorder: false },
        border: { display: false },
        ticks: {
          color: '#8A7F74', font: { size: 11 }, padding: 8,
          stepSize: 0.25,
          callback: v => (v >= 0 ? '+' : '') + v.toFixed(2) + '%',
        },
        title: {
          display: true,
          text: '% Deviation from Peg',
          color: '#8A7F74', font: { size: 11 },
          padding: { right: 10 },
        },
      },
      // Right: volume
      yVol: {
        position: 'right',
        min: 0,
        grid: { display: false },
        border: { display: false },
        ticks: {
          color: '#B8AA98', font: { size: 11 }, padding: 8,
          callback: v => {
            if (v >= 1e6) return '$' + (v / 1e6).toFixed(0) + 'M';
            if (v >= 1e3) return '$' + (v / 1e3).toFixed(0) + 'K';
            return '$' + v;
          },
        },
        title: {
          display: true,
          text: 'Volume (USD)',
          color: '#B8AA98', font: { size: 11 },
          padding: { left: 10 },
        },
      },
    },
    plugins: {
      legend: { display: false },
      // ── Annotations ──────────────────────────────────────────
      annotation: {
        annotations: {
          // Thick black zero baseline
          zeroLine: {
            type: 'line',
            scaleID: 'yDev',
            value: 0,
            borderColor: 'rgba(0,0,0,0.75)',
            borderWidth: 2,
          },
          // Upper threshold +0.5% — dashed red
          upperBand: {
            type: 'line',
            scaleID: 'yDev',
            value: 0.5,
            borderColor: '#EF4444',
            borderWidth: 1.5,
            borderDash: [6, 4],
            label: {
              display: true,
              content: '+0.5%',
              position: 'start',
              xAdjust: 6,
              color: '#EF4444',
              backgroundColor: 'transparent',
              font: { size: 10, weight: '600' },
              padding: { y: 2 },
            },
          },
          // Lower threshold -0.5% — dashed red
          lowerBand: {
            type: 'line',
            scaleID: 'yDev',
            value: -0.5,
            borderColor: '#EF4444',
            borderWidth: 1.5,
            borderDash: [6, 4],
            label: {
              display: true,
              content: '-0.5%',
              position: 'start',
              xAdjust: 6,
              color: '#EF4444',
              backgroundColor: 'transparent',
              font: { size: 10, weight: '600' },
              padding: { y: 2 },
            },
          },
          // Largest volume spike — vertical marker
          volSpikeBar: {
            type: 'line',
            scaleID: 'x',
            value: VOL_SPIKE_DATE.getTime(),
            borderColor: 'rgba(100,90,80,0.45)',
            borderWidth: 1,
            borderDash: [4, 4],
          },
          volSpikeLabel: {
            type: 'label',
            xValue: VOL_SPIKE_DATE.getTime(),
            yValue: 0.72,
            yScaleID: 'yDev',
            content: ['Feb 20', '$29.0M vol'],   // largest vol spike
            color: '#6F5F4E',
            backgroundColor: 'rgba(255,255,255,0.88)',
            borderColor: 'rgba(0,0,0,0.10)',
            borderWidth: 1,
            borderRadius: 5,
            font: { size: 10 },
            padding: { x: 6, y: 4 },
          },
          // Largest price dip — point + label
          dipPoint: {
            type: 'point',
            xValue: DIP_DATE.getTime(),
            yValue: DIP_VAL,
            yScaleID: 'yDev',
            backgroundColor: '#EF4444',
            borderColor: '#FFFFFF',
            borderWidth: 1.5,
            radius: 5,
          },
          dipLabel: {
            type: 'label',
            xValue: DIP_DATE.getTime(),
            yValue: DIP_VAL - 0.12,
            yScaleID: 'yDev',
            content: ['Feb 6', '-0.81%'],
            color: '#EF4444',
            backgroundColor: 'rgba(255,255,255,0.88)',
            borderColor: 'rgba(239,68,68,0.3)',
            borderWidth: 1,
            borderRadius: 5,
            font: { size: 10, weight: '600' },
            padding: { x: 6, y: 4 },
          },
        },
      },
      tooltip: {
        backgroundColor: '#FFFFFF',
        titleColor: '#2C2622', bodyColor: '#6F5F4E',
        borderColor: 'rgba(0,0,0,0.1)', borderWidth: 1,
        titleFont: { size: 12, weight: '600' },
        bodyFont: { size: 12 }, padding: 12, cornerRadius: 8,
        callbacks: {
          title: ctx => {
            const d = new Date(ctx[0].parsed.x);
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          },
          label: ctx => {
            if (ctx.dataset.label === 'Volume (USD)') {
              const v = ctx.parsed.y;
              const fmt = v >= 1e6 ? '$' + (v/1e6).toFixed(2) + 'M' : '$' + (v/1e3).toFixed(0) + 'K';
              return `  Volume: ${fmt}`;
            }
            const v = ctx.parsed.y;
            const tag = v >= 0 ? '▲ Premium' : '▼ Discount';
            return `  ${tag}: ${v >= 0 ? '+' : ''}${v.toFixed(4)}%`;
          },
          afterLabel: ctx => {
            if (ctx.dataset.label !== 'Volume (USD)') {
              const v = ctx.parsed.y;
              return `  NAV: $${(1 + v / 100).toFixed(6)}`;
            }
          }
        }
      },
    },
    layout: { padding: { top: 12, right: 8, bottom: 0, left: 0 } },
  },
});
</script>
</body>
</html>
