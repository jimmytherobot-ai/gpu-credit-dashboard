// ── Step 1: parse timestamps ───────────────────────────────────────
const MS_7D = 7 * 24 * 60 * 60 * 1000;
const parsed = rawRows.map(r => ({
  t: new Date(r[0]).getTime(),
  wm: r[1], pyusd: r[2], loan: r[3]
}));

// ── Step 2: 7-day rolling average (calendar window) ────────────────
const smoothed = parsed.map(row => {
  const win = parsed.filter(r => r.t >= row.t - MS_7D && r.t <= row.t);
  const n = win.length;
  return {
    t:     row.t,
    wm:    win.reduce((s, r) => s + r.wm,    0) / n,
    pyusd: win.reduce((s, r) => s + r.pyusd,  0) / n,
    loan:  win.reduce((s, r) => s + r.loan,   0) / n,
  };
});

// ── Step 3: convert to percentages of daily total ─────────────────
// Clip to Aug 18 2025 onwards for display
const START = new Date('2025-08-18').getTime();

const rows = smoothed
  .filter(r => r.t >= START)
  .map(r => {
    const total = r.wm + r.pyusd + r.loan;
    if (total === 0) return { t: r.t, wm: 100, pyusd: 0, loan: 0 };
    return {
      t:     r.t,
      wm:    (r.wm    / total) * 100,
      pyusd: (r.pyusd / total) * 100,
      loan:  (r.loan  / total) * 100,
    };
  });

// ── Series definitions (bottom → top) ─────────────────────────────
const series = [
  { key: 'wm',    label: 'Wrapped M (wM)',  color: COLORS.wm    },
  { key: 'pyusd', label: 'PYUSD',           color: COLORS.pyusd },
  { key: 'loan',  label: 'GPU Loan Book',   color: COLORS.loan  },
];

Chart.defaults.font.family = "'Geist', 'Helvetica Neue', Helvetica, Arial, sans-serif";

const datasets = series.map(s => ({
  label: s.label,
  data: rows.map(r => ({ x: new Date(r.t), y: r[s.key] })),
  backgroundColor: s.color + '50',
  borderColor: s.color,
  borderWidth: 1.5,
  fill: 'stack',
  pointRadius: 0,
  pointHitRadius: 6,
  tension: 0.3,
}));

const ctx = document.getElementById('chart').getContext('2d');
new Chart(ctx, {

        },
      },

        },

        },
        ticks: {

          stepSize: 20,

        },
      },
    },
    plugins: {

        borderWidth: 1,

        padding: 12,
        cornerRadius: 8,
        callbacks: {
          title: ctx => {
            const d = new Date(ctx[0].parsed.x);
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          },
          label: ctx => {
            return `  ${ctx.dataset.label}: ${ctx.raw.y.toFixed(1)}%`;
          },
        }
      },
    },
    layout: {
      padding: { top: 8, right: 8, bottom: 0, left: 0 },
    },
  },
});

series.forEach(s => {
