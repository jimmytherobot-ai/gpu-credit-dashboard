Chart.defaults.font.family = "'Geist', 'Helvetica Neue', Helvetica, Arial, sans-serif";

// Normalise each row to 100%
const normRaw = raw.map(r => {
  const total = SERIES.reduce((sum, ser) => sum + (r[ser.idx] || 0), 0);
  const out = [r[0]];
  SERIES.forEach(ser => { out[ser.idx] = total > 0 ? (r[ser.idx] || 0) / total * 100 : 0; });
  return out;
});

const datasets = SERIES.map(s => ({
  label: s.label,
  data: normRaw.map(r => ({ x: new Date(r[0]), y: r[s.idx] })),
  backgroundColor: s.color + '80',
  borderColor: s.color,
  borderWidth: 1,
  fill: 'stack',
  pointRadius: 0,
  pointHitRadius: 6,
  tension: 0.2,
}));
