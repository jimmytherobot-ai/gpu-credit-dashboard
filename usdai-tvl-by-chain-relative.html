// ── Build Chart.js datasets ───────────────────────────────────────
Chart.defaults.font.family = "'Geist', 'Helvetica Neue', Helvetica, Arial, sans-serif";

// Normalise each row to 100%
const normRaw = raw.map(r => {
  const total = SERIES.reduce((sum, ser) => sum + (r[ser.idx] || 0), 0);
  const out = [r[0]];
  SERIES.forEach(ser => { out[ser.idx] = total > 0 ? (r[ser.idx] || 0) / total * 100 : 0; });
  return out;
});

const datasets = SERIES.map(s => ({
  label: s.label,
  data: normRaw.map(r => ({ x: new Date(r[0]), y: r[s.idx] })),
  backgroundColor: s.color + '80',
  borderColor: s.color,
  borderWidth: 1,
  fill: 'stack',
  pointRadius: 0,
  pointHitRadius: 6,
  tension: 0.2,
}));

const ctx = document.getElementById('chart').getContext('2d');
new Chart(ctx, {
  type: 'line',
  data: { datasets },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    scales: {
      x: {
        type: 'time',
        time: {
          unit: 'month',
          displayFormats: { month: 'MMM yyyy' },
        },
        min: new Date('2025-08-18'),
        max: new Date('2026-05-13'),
        grid: { color: 'rgba(0,0,0,0.06)', drawTicks: false },
        border: { display: true, color: 'rgba(0,0,0,0.12)' },
        ticks: {
          color: '#8A7F74', font: { size: 11 },
          maxRotation: 0, autoSkip: false, padding: 8,
        },
      },
      y: {
        stacked: true,
        min: 0,
        max: 100,
        grid: { color: 'rgba(0,0,0,0.06)', drawBorder: false },
        border: { display: false },
        ticks: {
          color: '#8A7F74', font: { size: 11 }, padding: 8,
          stepSize: 20,
          callback: v => v + '%',
        },
      },
    },
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: '#FFFFFF',
        titleColor: '#2C2622', bodyColor: '#6F5F4E',
        borderColor: 'rgba(0,0,0,0.1)', borderWidth: 1,
        titleFont: { size: 12, weight: '600' },
        bodyFont: { size: 12 }, padding: 12, cornerRadius: 8,
        callbacks: {
          title: ctx => {
            const d = new Date(ctx[0].parsed.x);
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          },
          label: ctx => {
            const v = ctx.raw.y;
            if (v < 0.01) return null;
            return `  ${ctx.dataset.label}: ${v.toFixed(1)}%`;
          },
          afterBody: () => `\n  Total: 100%`
        }
      },
    },
    layout: { padding: { top: 8, right: 4, bottom: 0, left: 0 } },
  },
});

// ── Legend ────────────────────────────────────────────────────────
const legendEl = document.getElementById('legend');
SERIES.forEach(s => {
  const item = document.createElement('div');
  item.className = 'legend-item';
  item.innerHTML = `<span class="legend-swatch" style="background:${s.color}90;border:1px solid ${s.color}"></span><span>${s.label}</span>`;
  legendEl.appendChild(item);
});
