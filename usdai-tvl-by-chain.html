Chart.defaults.font.family = "'Geist', 'Helvetica Neue', Helvetica, Arial, sans-serif";

const datasets = SERIES.map(s => ({
  label: s.label,
  data: raw.map(r => ({ x: new Date(r[0]), y: r[s.idx] })),
  backgroundColor: s.color + '80',
  borderColor: s.color,
  borderWidth: 1,
  fill: 'stack',
  pointRadius: 0,
  pointHitRadius: 6,
  tension: 0.2,
}));

const ctx = document.getElementById('chart').getContext('2d');
new Chart(ctx, {
  type: 'line',
  data: { datasets },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    scales: {
      x: {
        type: 'time',
        time: {
          unit: 'month',
          displayFormats: { month: 'MMM yyyy' },
        },
        min: new Date('2025-08-18'),
        max: new Date('2026-05-13'),
        grid: { color: 'rgba(0,0,0,0.06)', drawTicks: false },
        border: { display: true, color: 'rgba(0,0,0,0.12)' },
        ticks: {
          color: '#8A7F74', font: { size: 11 },
          maxRotation: 0, autoSkip: false, padding: 8,
        },
      },
      y: {
        stacked: true,
        grid: { color: 'rgba(0,0,0,0.06)', drawBorder: false },
        border: { display: false },
        ticks: {
          color: '#8A7F74', font: { size: 11 }, padding: 8,
          callback: v => {
            if (v >= 1e9) return '$' + (v / 1e9).toFixed(1) + 'B';
            if (v >= 1e6) return '$' + Math.round(v / 1e6) + 'M';
            return '$' + v;
          },
        },
        min: 0,
      },
    },
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: '#FFFFFF',
        titleColor: '#2C2622', bodyColor: '#6F5F4E',
        borderColor: 'rgba(0,0,0,0.1)', borderWidth: 1,
        titleFont: { size: 12, weight: '600' },
        bodyFont: { size: 12 }, padding: 12, cornerRadius: 8,
        callbacks: {
          title: ctx => {
            const d = new Date(ctx[0].parsed.x);
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          },
          label: ctx => {
            const v = ctx.raw.y;
            if (v < 1000) return null;
            const fmt = v >= 1e9
              ? '$' + (v / 1e9).toFixed(2) + 'B'
              : '$' + (v / 1e6).toFixed(1) + 'M';
            return `  ${ctx.dataset.label}: ${fmt}`;
          },
          afterBody: ctx => {
            const total = ctx.reduce((s, c) => s + (c.raw.y || 0), 0);
            const fmt = total >= 1e9
              ? '$' + (total / 1e9).toFixed(2) + 'B'
              : '$' + (total / 1e6).toFixed(1) + 'M';
            return `\n  Total: ${fmt}`;
          }
        }
      },
    },
    layout: { padding: { top: 8, right: 4, bottom: 0, left: 0 } },
  },
});

});
